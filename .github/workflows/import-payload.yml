name: Finalize repository import
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Unpack project
        shell: bash
        run: |
          tar -xJf bootstrap/payload.tar.xz -C .
          rm -rf bootstrap
          rm -f .github/workflows/import-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import modernized practice"
            git push
          fi
