name: PHP CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
      - run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: docker compose config
